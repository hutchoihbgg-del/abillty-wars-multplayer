<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Shindo PvP Arena</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0c0d12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; background: #1c221a; }

        /* Left-Middle Main Menu */
        #main-menu {
            position: absolute;
            top: 50%;
            left: 5%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .menu-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ff4500;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.6);
            margin: 0 0 10px 0;
        }

        .menu-item {
            font-size: 28px;
            font-weight: bold;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            user-select: none;
            width: fit-content;
        }

        .menu-item:hover {
            color: #ff4500;
            transform: translateX(10px);
            text-shadow: 0 0 8px rgba(255, 69, 0, 0.8);
        }

        /* Split Spin Screen */
        #spin-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 15, 0.95);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spin-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .spins-counter {
            font-size: 20px;
            color: #ffaa00;
            font-weight: bold;
        }

        .split-container {
            display: flex;
            width: 80%;
            max-width: 900px;
            height: 350px;
            border: 2px solid #ff4500;
            border-radius: 12px;
            overflow: hidden;
            background: #14161f;
        }

        .spin-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .spin-section:first-child {
            border-right: 2px solid #ff4500;
        }

        .scroll-display {
            width: 100%;
            background: #202433;
            border: 1px solid #444;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
        }

        .btn {
            background: #ff4500;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: #ff6a33; }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        /* HUD Overlay */
        #hud {
            display: none;
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="main-menu">
        <h1 class="menu-title">SHINDO 2D</h1>
        <div class="menu-item" onclick="enterPVP()">PVP ARENA</div>
        <div class="menu-item" onclick="openSpinMenu()">SPIN & SCROLLS</div>
    </div>

    <div id="spin-screen">
        <div class="spin-header">
            <h2>SCROLL SPINNER</h2>
            <div class="spins-counter">Spins Left: <span id="spin-count">10</span></div>
        </div>

        <div class="split-container">
            <div class="spin-section">
                <h3>ELEMENTS</h3>
                <div class="scroll-display" id="element-display">None</div>
                <button class="btn" id="element-btn" onclick="spinElement()">Roll Element</button>
            </div>

            <div class="spin-section">
                <h3>BLOODLINES</h3>
                <div class="scroll-display" id="bloodline-display">None</div>
                <button class="btn" id="bloodline-btn" onclick="spinBloodline()">Roll Bloodline</button>
            </div>
        </div>

        <br>
        <button class="btn" style="background: #333;" onclick="closeSpinMenu()">Back to Menu</button>
    </div>

    <div id="hud">
        <div><strong>HP:</strong> <span id="hp-val">100</span> / 100</div>
        <div><strong>Element:</strong> <span id="hud-elem">None</span></div>
        <div><strong>Bloodline:</strong> <span id="hud-bl">None</span></div>
        <div><strong>Players in Match:</strong> <span id="player-count">1</span>/5</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="multiplayer.js"></script>
<script>
    let totalSpins = 10;
    let currentElement = "None";
    let currentBloodline = "None";

    const elementsPool = ["Lightning", "Air", "Water", "Fire"];
    const bloodlinePool = ["Akuma", "Rengoku", "Sengoku", "Ember"];

    function openSpinMenu() {
        document.getElementById('spin-screen').style.display = 'flex';
    }

    function closeSpinMenu() {
        document.getElementById('spin-screen').style.display = 'none';
    }

    function updateSpinUI() {
        document.getElementById('spin-count').innerText = totalSpins;
        if (totalSpins <= 0) {
            document.getElementById('element-btn').disabled = true;
            document.getElementById('bloodline-btn').disabled = true;
        }
    }

    function spinElement() {
        if (totalSpins <= 0) return;
        totalSpins--;
        const picked = elementsPool[Math.floor(Math.random() * elementsPool.length)];
        currentElement = picked;
        document.getElementById('element-display').innerText = picked;
        updateSpinUI();
    }

    function spinBloodline() {
        if (totalSpins <= 0) return;
        totalSpins--;
        const picked = bloodlinePool[Math.floor(Math.random() * bloodlinePool.length)];
        currentBloodline = picked;
        document.getElementById('bloodline-display').innerText = picked;
        updateSpinUI();
    }

    function enterPVP() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('hud-elem').innerText = currentElement;
        document.getElementById('hud-bl').innerText = currentBloodline;
        
        startMultiplayerGame(currentElement, currentBloodline);
    }
</script>
</body>
</html>
</body>
</html>
